<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Finlytic OTP</title>
</head>

<body style="margin:0; padding:0; background-color:#f0f2ff; font-family: 'Segoe UI', Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2ff; padding: 40px 0;">
    <tr>
        <td align="center">
            <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:20px; overflow:hidden; box-shadow: 0 8px 40px rgba(99,102,241,0.12);">

                <!-- Header -->
                <tr>
                    <td style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); padding: 40px 48px; text-align: center;">
                        <h1 style="margin:0; color:#ffffff; font-size:28px; font-weight:800;">Finlytics</h1>
                        <p style="margin:4px 0 0; color:rgba(255,255,255,0.8); font-size:13px;">Personal Finance</p>
                    </td>
                </tr>

                <!-- Title -->
                <tr>
                    <td style="padding: 24px 48px 8px; text-align: center;">
                        <h2 style="margin:0; color:#1e1b4b;">Verify Your Email</h2>
                        <p style="margin:10px 0 0; color:#6b7280;">
                            Use the code below to verify your account.<br/>
                            This code expires in <strong style="color:#6366f1;">5 minutes</strong>.
                        </p>
                    </td>
                </tr>

                <!-- OTP BOXES -->
                <tr>
                    <td align="center" style="padding: 36px 48px;">
                        <table cellpadding="0" cellspacing="0">
                            <tr>
                                <td th:each="digit : ${otpDigits}" style="padding: 0 6px;">
                                    <div style="
                                        width: 48px; height: 56px;
                                        background: #f8f9ff;
                                        border: 2px solid #6366f1;
                                        border-radius: 12px;
                                        font-size: 28px;
                                        font-weight: 700;
                                        color: #6366f1;
                                        text-align: center;
                                        line-height: 56px;
                                        font-family: monospace;
                                    ">
                                        <span th:text="${digit}"></span>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding: 20px; text-align:center;">
                        <p style="font-size:12px; color:#9ca3af;">
                            Never share this code. Finlytics will never ask for your OTP.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
